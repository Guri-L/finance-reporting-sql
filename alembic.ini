[alembic]
script_location = migrations
prepend_sys_path = .
# The connection string is taken from the DATABASE_URL environment variable
# in migrations/env.py, so the same migrations run locally and on a server.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
