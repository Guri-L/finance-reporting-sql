# Local stack: PostgreSQL, a one-off setup job, and the web app.
#   docker compose up --build      then open http://localhost:8000
# On a server, skip the db service and point DATABASE_URL and
# REPORTING_DATABASE_URL at the company database instead (docs/deployment.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  # Migrate, generate and load the ledger, create the read-only login and run
  # the controls. Exits non-zero (and the app does not start) if a control fails.
  setup:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment: &owner_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-finance_owner}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-finance}
      REPORTING_DB_USER: ${REPORTING_DB_USER:-reporting_app}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:-change-me-too}
    command: ["python", "-m", "scripts.setup"]

  app:
    build: .
    depends_on:
      setup: {condition: service_completed_successfully}
    environment:
      REPORTING_DATABASE_URL: postgresql://${REPORTING_DB_USER:-reporting_app}:${REPORTING_DB_PASSWORD:-change-me-too}@db:5432/${POSTGRES_DB:-finance}
      AUTH_MODE: ${AUTH_MODE:-demo}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s

volumes:
  pgdata:
